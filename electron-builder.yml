appId: net.ottomated.crewlink.beta
productName: Better-CrewLink
copyright: Copyright © 2021 OhMyGuus
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
  - "!**/*.map"
  # node-gyp build intermediates; only the .node binary is needed at runtime.
  - "!**/node_modules/*/build/Release/obj/**"
  - "!**/node_modules/*/build/Release/*.{iobj,ipdb,pdb,lib,exp}"

win:
  publish:
    - provider: github
      owner: Saturna19-fr
      repo: BetterCrewLink
linux:
  target:
    - "AppImage"
  publish:
    - provider: github
      owner: Saturna19-fr
      repo: BetterCrewLink
